<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir en navegador externo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .icon { font-size: 3rem; margin-bottom: 1rem; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #4285f4;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover  { background: #3367d6; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #a0aec0; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌐</div>
    <h1>Abrir en el navegador externo</h1>
    <p class="subtitle">
      Este enlace fue abierto dentro de la aplicación de correo.<br>
      Pulsa el botón para cargarlo en Chrome u otro navegador del dispositivo.
    </p>

    <button id="open-btn" class="btn-primary" onclick="openInExternalBrowser()">
      Abrir en Chrome / Navegador externo
    </button>
  </div>

  <script>
    var ua = navigator.userAgent || '';
    function isAndroid() { return /android/i.test(ua); }

    function resetButton() {
      var btn = document.getElementById('open-btn');
      btn.disabled = false;
      btn.textContent = 'Abrir en Chrome / Navegador externo';
    }

    function buildIntentUri() {
      var loc    = window.location;
      var scheme = loc.protocol.replace(':', '');
      var host   = loc.hostname + (loc.port ? ':' + loc.port : '');
      var path   = loc.pathname + loc.search;
      return (
        'intent://' + host + path +
        '#Intent;scheme=' + scheme +
        ';S.browser_fallback_url=' + encodeURIComponent(loc.href) +
        ';end'
      );
    }

    // ÚNICA estrategia fiable contra el CCT de Gmail:
    // Web Share API → abre el sharesheet nativo de Android.
    // Es UI del sistema operativo, fuera del control de Chrome/Brave/CCT.
    // El usuario elige el navegador y Android lo lanza como tarea independiente.
    //
    // IMPORTANTE: navigator.share() debe invocarse SINCRÓNICAMENTE desde el
    // gesto del usuario (clic). Si se llama desde setTimeout o tras un await,
    // el navegador descarta la llamada silenciosamente por seguridad.
    function openInExternalBrowser() {
      if (!isAndroid()) {
        window.open(window.location.href, '_blank');
        return;
      }

      var btn = document.getElementById('open-btn');

      if (navigator.share) {
        navigator.share({
          title: document.title,
          url:   window.location.href
        }).catch(function () {
          // Usuario canceló o falló: probar el intent como plan B
          window.location.href = buildIntentUri();
        });
      } else {
        // Navegadores muy antiguos sin Web Share API
        btn.disabled = true;
        btn.textContent = 'Abriendo…';
        window.location.href = buildIntentUri();
        setTimeout(resetButton, 1500);
      }
    }
  </script>
</body>
</html>
