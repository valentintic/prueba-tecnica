<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir en navegador externo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .icon { font-size: 3rem; margin-bottom: 1rem; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    #env-banner {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.85rem;
      border-radius: 99px;
      margin-bottom: 1.5rem;
    }
    .env-inapp  { background: #fff3cd; color: #856404; }
    .env-normal { background: #d1e7dd; color: #0a3622; }
    .env-unknown{ background: #e2e8f0; color: #4a5568; }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #4285f4;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover  { background: #3367d6; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #a0aec0; cursor: default; }

    .note {
      font-size: 0.78rem;
      color: #a0aec0;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌐</div>
    <h1>Abrir en el navegador externo</h1>
    <p class="subtitle">
      Este enlace fue abierto dentro de la aplicación de correo.<br>
      Pulsa el botón para cargarlo en Chrome u otro navegador del dispositivo.
    </p>

    <div id="env-banner" class="env-unknown">Detectando entorno…</div>

    <button id="open-btn" class="btn-primary" onclick="openInExternalBrowser()">
      Abrir en Chrome / Navegador externo
    </button>

    <p class="note" id="env-detail"></p>
  </div>

  <script>
    var ua = navigator.userAgent || '';

    function isAndroid() { return /android/i.test(ua); }

    function detectBrowserEnv() {
      if (/wv/.test(ua) && isAndroid())                    return 'inapp';
      if (/FBAN|FBAV|Instagram|Line\/|Twitter/i.test(ua)) return 'inapp';
      if (isAndroid())                                     return 'maybe';
      return 'normal';
    }

    // Orden de intentos:
    //   1. null  → navegador por defecto del usuario (Chrome, Brave, Firefox…)
    //   2. paquetes específicos como fallback si el por defecto falla
    var PACKAGES = [
      null,
      'com.android.chrome',               // Chrome
      'com.brave.browser',                // Brave
      'org.mozilla.firefox',              // Firefox
      'com.microsoft.emmx',               // Edge
      'com.opera.browser',                // Opera
      'com.sec.android.app.sbrowser',     // Samsung Internet
    ];

    var attempt    = 0;
    var retryTimer = null;
    var intentFired = false;

    function resetButton() {
      var btn = document.getElementById('open-btn');
      btn.disabled = false;
      btn.textContent = 'Abrir en Chrome / Navegador externo';
    }

    var hiddenAt = null;
    var MIN_HIDDEN_MS = 800; // menos de esto es un parpadeo del sistema, no un cambio de app

    document.addEventListener('visibilitychange', function () {
      if (document.hidden && intentFired) {
        hiddenAt = Date.now();
        clearTimeout(retryTimer);
      }
      if (!document.hidden && intentFired) {
        var elapsed = hiddenAt ? (Date.now() - hiddenAt) : 0;
        hiddenAt = null;
        if (elapsed >= MIN_HIDDEN_MS) {
          // Estuvo oculta suficiente tiempo: el intent funcionó, el usuario volvió
          intentFired = false;
          resetButton();
        } else {
          // Parpadeo breve del sistema: reanudar la cadena de reintentos
          retryTimer = setTimeout(tryNextBrowser, 700);
        }
      }
    });

    function buildIntentUri(pkg) {
      var loc    = window.location;
      var scheme = loc.protocol.replace(':', '');
      var host   = loc.hostname + (loc.port ? ':' + loc.port : '');
      var path   = loc.pathname + loc.search;
      // Intent minimalista: sin launchFlags explícitas Android decide mejor
      // cuándo crear una tarea nueva y no se queda atrapado en el CCT.
      return (
        'intent://' + host + path +
        '#Intent;scheme=' + scheme +
        (pkg ? ';package=' + pkg : '') +
        ';S.browser_fallback_url=' + encodeURIComponent(loc.href) +
        ';end'
      );
    }

    function tryNextBrowser() {
      if (attempt >= PACKAGES.length) {
        // Ningún navegador alternativo instalado (o todos bloqueados).
        // Fallback: Web Share API → abre el sharesheet nativo de Android.
        // Es UI del sistema operativo, Chrome/CCT no puede interceptarla.
        if (navigator.share) {
          var btn = document.getElementById('open-btn');
          btn.textContent = 'Elegir cómo abrir…';
          navigator.share({
            title: document.title,
            url: window.location.href
          }).finally(function () { resetButton(); });
        } else {
          resetButton();
        }
        return;
      }
      intentFired = true;
      window.location.href = buildIntentUri(PACKAGES[attempt]);
      attempt++;
      retryTimer = setTimeout(tryNextBrowser, 600);
    }

    function openInExternalBrowser() {
      if (!isAndroid()) {
        window.open(window.location.href, '_blank');
        return;
      }
      var btn = document.getElementById('open-btn');
      btn.disabled = true;
      btn.textContent = 'Abriendo…';
      attempt = 0;
      intentFired = false;
      clearTimeout(retryTimer);
      tryNextBrowser();
    }

    (function initUI() {
      var banner = document.getElementById('env-banner');
      var detail = document.getElementById('env-detail');
      var env    = detectBrowserEnv();

      if (env === 'inapp') {
        banner.className   = 'env-inapp';
        banner.textContent = '⚠ Navegador integrado';
        detail.textContent = 'UA: ' + ua.substring(0, 100);
      } else if (env === 'maybe') {
        banner.className   = 'env-inapp';
        banner.textContent = '⚠ Posiblemente en Gmail / app de correo';
        detail.textContent = 'La UA de Custom Chrome Tab es idéntica a Chrome; detección heurística.';
      } else {
        banner.className   = 'env-normal';
        banner.textContent = '✓ Navegador estándar';
        detail.textContent = 'Parece que ya estás en un navegador externo.';
      }
    })();
  </script>
</body>
</html>
