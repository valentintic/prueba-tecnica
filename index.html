<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir en navegador externo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .icon { font-size: 3rem; margin-bottom: 1rem; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #4285f4;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover  { background: #3367d6; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #a0aec0; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌐</div>
    <h1>Abrir fuera del correo</h1>
    <p class="subtitle">
      Este enlace fue abierto dentro de la aplicación de correo.<br>
      Pulsa el botón y elige el navegador donde quieres abrirlo.
    </p>

    <button id="open-btn" class="btn-primary" onclick="openInExternalBrowser()">
      Abrir en otra app
    </button>
  </div>

  <script>
    var ua = navigator.userAgent || '';
    function isAndroid() { return /android/i.test(ua); }

    function buildIntentUri() {
      var loc    = window.location;
      var scheme = loc.protocol.replace(':', '');
      var host   = loc.hostname + (loc.port ? ':' + loc.port : '');
      var path   = loc.pathname + loc.search;
      return (
        'intent://' + host + path +
        '#Intent;scheme=' + scheme +
        ';S.browser_fallback_url=' + encodeURIComponent(loc.href) +
        ';end'
      );
    }

    // Estrategia: invocar el sharesheet nativo de Android vía Web Share API.
    //
    // Tras probar varios enfoques (intent:// a Chrome, component específico,
    // launchFlags NEW_TASK/CLEAR_TASK, cadena de paquetes...) la conclusión es
    // que Chrome bloquea cualquier intent que resuelva a sí mismo cuando actúa
    // como host del Custom Chrome Tab de Gmail. Es una protección deliberada
    // del navegador, no algo que se pueda sortear desde JavaScript.
    //
    // La Web Share API es la única vía estándar que invoca UI del sistema
    // operativo (no del navegador), por lo que escapa siempre del CCT. El
    // usuario elige el destino y Android lanza ese navegador como tarea
    // independiente. El brief acepta explícitamente "otras opciones mejores".
    //
    // navigator.share() requiere user gesture activo: debe llamarse de forma
    // síncrona desde el handler del clic, no desde setTimeout ni tras await.
    function openInExternalBrowser() {
      if (!isAndroid()) {
        window.open(window.location.href, '_blank');
        return;
      }
      if (navigator.share) {
        navigator.share({
          title: document.title,
          url:   window.location.href
        }).catch(function () {});
      } else {
        // Fallback para navegadores sin Web Share API (muy raros hoy)
        window.location.href = buildIntentUri();
      }
    }
  </script>
</body>
</html>
