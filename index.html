<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir en navegador externo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .icon { font-size: 3rem; margin-bottom: 1rem; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #4285f4;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover  { background: #3367d6; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #a0aec0; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌐</div>
    <h1>Abrir en el navegador externo</h1>
    <p class="subtitle">
      Este enlace fue abierto dentro de la aplicación de correo.<br>
      Pulsa el botón para cargarlo en Chrome u otro navegador del dispositivo.
    </p>

    <button id="open-btn" class="btn-primary" onclick="openInExternalBrowser()">
      Abrir en Chrome / Navegador externo
    </button>
  </div>

  <script>
    var ua = navigator.userAgent || '';
    function isAndroid() { return /android/i.test(ua); }

    function resetButton() {
      var btn = document.getElementById('open-btn');
      btn.disabled = false;
      btn.textContent = 'Abrir en Chrome / Navegador externo';
    }

    // Componentes específicos (package/activity) de los navegadores principales.
    // Apuntar al COMPONENT exacto en lugar de solo al package fuerza a Android
    // a lanzar esa activity concreta como app independiente, bypaseando el
    // modo Custom Chrome Tab (que es la razón por la que Gmail "atrapa" la web).
    var COMPONENTS = [
      'com.android.chrome/com.google.android.apps.chrome.Main',          // Chrome
      'com.brave.browser/com.google.android.apps.chrome.Main',           // Brave (fork de Chromium)
      'org.mozilla.firefox/org.mozilla.gecko.BrowserApp',                // Firefox
      'com.microsoft.emmx/com.google.android.apps.chrome.Main',          // Edge (fork de Chromium)
      'com.opera.browser/com.opera.android.BrowserActivity',             // Opera
      'com.sec.android.app.sbrowser/com.sec.android.app.sbrowser.SBrowserMainActivity', // Samsung
    ];

    var attempt    = 0;
    var retryTimer = null;
    var intentFired = false;

    function buildIntentUri(component) {
      var loc    = window.location;
      var scheme = loc.protocol.replace(':', '');
      var host   = loc.hostname + (loc.port ? ':' + loc.port : '');
      var path   = loc.pathname + loc.search;
      return (
        'intent://' + host + path +
        '#Intent;scheme=' + scheme +
        ';action=android.intent.action.VIEW' +
        ';category=android.intent.category.BROWSABLE' +
        ';component=' + component +
        ';launchFlags=0x14000000' + // NEW_TASK | RESET_TASK_IF_NEEDED
        ';end'
      );
    }

    // Detectar si el intent funcionó: la página queda oculta cuando se cambia de app
    var hiddenAt = null;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && intentFired) {
        hiddenAt = Date.now();
        clearTimeout(retryTimer);  // alguien cogió el intent, parar cadena
      } else if (!document.hidden && intentFired) {
        var elapsed = hiddenAt ? (Date.now() - hiddenAt) : 0;
        hiddenAt = null;
        if (elapsed >= 800) {
          // El usuario volvió tras abrir otra app: éxito
          intentFired = false;
          resetButton();
        }
      }
    });

    function tryNextComponent() {
      if (attempt >= COMPONENTS.length) {
        // Ningún navegador soportado instalado: usar sharesheet como último recurso
        intentFired = false;
        resetButton();
        if (navigator.share) {
          navigator.share({
            title: document.title,
            url:   window.location.href
          }).catch(function () {});
        }
        return;
      }
      intentFired = true;
      window.location.href = buildIntentUri(COMPONENTS[attempt]);
      attempt++;
      retryTimer = setTimeout(tryNextComponent, 500);
    }

    function openInExternalBrowser() {
      if (!isAndroid()) {
        window.open(window.location.href, '_blank');
        return;
      }
      var btn = document.getElementById('open-btn');
      btn.disabled = true;
      btn.textContent = 'Abriendo…';
      attempt = 0;
      intentFired = false;
      clearTimeout(retryTimer);
      tryNextComponent();
    }
  </script>
</body>
</html>
