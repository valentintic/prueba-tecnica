<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir en navegador externo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .icon { font-size: 3rem; margin-bottom: 1rem; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #4285f4;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover  { background: #3367d6; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #a0aec0; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌐</div>
    <h1>Abrir en el navegador externo</h1>
    <p class="subtitle">
      Este enlace fue abierto dentro de la aplicación de correo.<br>
      Pulsa el botón para cargarlo en Chrome u otro navegador del dispositivo.
    </p>

    <button id="open-btn" class="btn-primary" onclick="openInExternalBrowser()">
      Abrir en Chrome / Navegador externo
    </button>
  </div>

  <script>
    var ua = navigator.userAgent || '';
    function isAndroid() { return /android/i.test(ua); }

    function resetButton() {
      var btn = document.getElementById('open-btn');
      btn.disabled = false;
      btn.textContent = 'Abrir en Chrome / Navegador externo';
    }

    function buildIntentUri() {
      var loc    = window.location;
      var scheme = loc.protocol.replace(':', '');
      var host   = loc.hostname + (loc.port ? ':' + loc.port : '');
      var path   = loc.pathname + loc.search;
      // Especificar el COMPONENT exacto (package/activity) en vez de solo package
      // fuerza a Android a lanzar esa activity concreta, bypaseando el modo CCT.
      // com.google.android.apps.chrome.Main es la activity principal de Chrome
      // (la que se abre cuando tocas el icono de Chrome en el launcher).
      return (
        'intent://' + host + path +
        '#Intent;scheme=' + scheme +
        ';action=android.intent.action.VIEW' +
        ';category=android.intent.category.BROWSABLE' +
        ';component=com.android.chrome/com.google.android.apps.chrome.Main' +
        ';launchFlags=0x14000000' + // NEW_TASK | RESET_TASK_IF_NEEDED
        ';S.browser_fallback_url=' + encodeURIComponent(loc.href) +
        ';end'
      );
    }

    function openInExternalBrowser() {
      if (!isAndroid()) {
        window.open(window.location.href, '_blank');
        return;
      }
      var btn = document.getElementById('open-btn');
      btn.disabled = true;
      btn.textContent = 'Abriendo Chrome…';

      // Forzar Chrome como app independiente apuntando a su Main activity
      window.location.href = buildIntentUri();

      // Si en 1.5s seguimos visibles, el intent fue bloqueado → sharesheet
      setTimeout(function () {
        btn.disabled = false;
        btn.textContent = 'Abrir en Chrome / Navegador externo';
        if (!document.hidden && navigator.share) {
          navigator.share({
            title: document.title,
            url:   window.location.href
          }).catch(function () {});
        }
      }, 1500);
    }
  </script>
</body>
</html>
